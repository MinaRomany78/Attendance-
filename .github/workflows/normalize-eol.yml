name: normalize-eol
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize run.bat to LF
        run: |
          python3 -c "import io;p='run.bat';b=io.open(p,'rb').read().replace(b'\r\n', b'\n');io.open(p,'wb').write(b)"
      - name: Commit and push
        run: |
          if git diff --quiet; then echo "nothing to do"; exit 0; fi
          git config user.name audit-bot
          git config user.email audit-bot@users.noreply.github.com
          git rm -q .github/workflows/normalize-eol.yml
          git add -A
          git commit -m "Normalize run.bat line endings to LF (text=auto policy)"
          git push origin HEAD:main
