name: fix-tests
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize diacritic
        run: |
          python3 - <<'EOF'
          import io
          p = 'tests/HrPayroll.Tests/PayrollTests.cs'
          s = io.open(p, encoding='utf-8').read()
          s = s.replace('يُضاف مرة أخرى', 'تُضاف مرة أخرى')
          io.open(p, 'w', encoding='utf-8', newline='\n').write(s)
          EOF
      - name: Commit and push
        run: |
          if git diff --quiet; then echo "nothing to do"; exit 0; fi
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git rm -q .github/workflows/fix-tests.yml
          git add -A
          git commit -m "Fix Arabic diacritic in payroll test comment"
          git push origin HEAD:main
